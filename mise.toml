min_version = "2026.1.0"

[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "macos-arm64"]

[tools]
go = "1.27.3"
golangci-lint = "2.14.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
node = "24.21.0"
"npm:markdownlint-cli2" = "0.24.0"

[env]
# Go's default GOTOOLCHAIN=auto lets it download and run whatever toolchain go.mod asks for. local pins execution to the Go that mise installed, so mise.toml is the only place the toolchain version is decided.
GOTOOLCHAIN = "local"

[tasks.build]
description = "Build build/esheep with git-derived version metadata."
run = '''
version="${VERSION:-$(git describe --tags --dirty --always 2>/dev/null || printf 'unknown')}"
mkdir -p build
go build -trimpath -buildvcs=false -ldflags "-X github.com/jmcampanini/esheep/internal/cli.Version=${version}" -o build/esheep .
'''

# The end-to-end suite drives build/esheep, so test depends on build and tells the suite where the binary is. Within one mise run, build runs once for both test and version-check.
[tasks.test]
description = "Run all tests uncached with the race detector."
depends = ["build"]
env = { ESHEEP_E2E_BINARY = "{{config_root}}/build/esheep" }
run = "go test -count=1 -race ./..."

[tasks.lint]
description = "Run static analysis."
run = "golangci-lint run ./..."

[tasks.lint-fix]
description = "Run static analysis with --fix."
run = "golangci-lint run --fix ./..."

[tasks.lint-markdown]
description = "Lint tracked Markdown using the shared Markdown rules."
run = "git ls-files -z -- '*.md' '*.markdown' | xargs -0 markdownlint-cli2"

[tasks.fmt]
description = "Format Go source files."
run = "golangci-lint fmt"

[tasks.fmt-check]
description = "Verify formatting without changing files."
run = "golangci-lint fmt --diff"

[tasks.tidy]
description = "Apply go mod tidy."
run = "go mod tidy"

[tasks.tidy-check]
description = "Verify go.mod and go.sum are tidy without changing them."
run = "go mod tidy -diff"

[tasks.version-check]
description = "Verify the built binary reports the injected version."
depends = ["build"]
run = '''
version="${VERSION:-$(git describe --tags --dirty --always 2>/dev/null || printf 'unknown')}"
case "$version" in
  unknown|n/a|"") echo "degenerate version identity: '$version'"; exit 1;;
esac
out="$(build/esheep --version)"
if [ "$out" != "esheep version $version" ]; then
  echo "version mismatch: got '$out', want 'esheep version $version'"
  exit 1
fi
'''

[tasks.vuln]
description = "Check dependencies and reachable code for known vulnerabilities."
run = "govulncheck ./..."

# check is read-only: it must leave the tracked tree unchanged and create nothing outside ignored paths. CI fails when it leaves a tracked change or a non-ignored untracked file behind. Add report-only tasks here; fixers (fmt, lint-fix, tidy) stay out.
[tasks.check]
description = "Run the complete local verification contract."
depends = ["fmt-check", "tidy-check", "lint", "lint-markdown", "test", "version-check", "vuln"]

[tasks.clean]
description = "Remove build artifacts and the Go test cache."
run = [
  "rm -rf build",
  "go clean -testcache",
]
