name: Renovate

on:
  schedule:
    - cron: "0 4,16 * * *"
      timezone: America/New_York
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: renovate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Run Renovate
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Renovate refuses to run mise unless the operator allows it, and without mise lock a tool update leaves mise.lock stale.
          RENOVATE_ALLOWED_UNSAFE_EXECUTIONS: mise
